<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Bookmark Organizer</title>
    <style>
      :root {
        --bg-init: #0b0e14;
        --card-init: #151b26;
        --border-init: rgba(130, 149, 184, 0.2);
        --text-sub: #8295b8;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-init: #f8fafc;
          --card-init: #ffffff;
          --border-init: rgba(130, 149, 184, 0.25);
          --text-sub: #64748b;
        }
      }
      body {
        margin: 0;
        background: var(--bg-init);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .init-skeleton-card {
        margin: 0 1.25rem 1rem;
        padding: 1.25rem;
        background: var(--card-init);
        border: 1px solid var(--border-init);
        border-radius: 12px;
        min-height: 80px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <header class="app-header">
        <h1 class="app-title">AI Bookmark Organizer</h1>
      </header>
      <div class="init-skeleton-card" style="height: 90px;"></div>
      <div class="init-skeleton-card" style="height: 140px;"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
